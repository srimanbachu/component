<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orb Voice</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <div class="orb-wrap" id="orbWrap">
      <!-- Rock bird (Figma node 3:2). viewBox padded so press/rebound squash never clips -->
      <svg class="bird" viewBox="-40 -40 703.079 703.079" aria-hidden="true">
        <ellipse id="birdBody" cx="311.54" cy="309.847" rx="309" ry="309" fill="#0A0A0A" />
        <rect id="birdNearEye" x="191.54" y="233.847" width="68" height="152" rx="34" fill="#FFFFFF" />
        <rect id="birdFarEye" x="363.54" y="233.847" width="68" height="152" rx="34" fill="#FFFFFF" />
      </svg>
      <button class="orb-hit" id="micBtn" aria-label="Start listening"></button>
    </div>

    <p class="status" id="status">Tap or hold the bird to speak</p>

    <section class="transcript" id="transcript" aria-live="polite">
      <p class="placeholder" id="placeholder">Your words will appear here.</p>
      <p class="text"><span id="final"></span><span id="interim"></span></p>
    </section>

    <div class="controls">
      <button class="chip" id="copyBtn" type="button">Copy</button>
      <button class="chip" id="clearBtn" type="button">Clear</button>
    </div>
  </main>

  <script src="bird.js"></script>
  <script src="script.js"></script>
</body>
</html>
